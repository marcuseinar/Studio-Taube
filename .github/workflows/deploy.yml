name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Runs after Sync Bokadirekt catalogue (03:00) so it deploys that night's
    # snapshot. This is also what applies a campaign's validTo without anyone
    # deploying by hand, and it is the only thing that starts a deploy after a
    # snapshot commit, since a push made with GITHUB_TOKEN triggers nothing.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify before deploying
        run: npm run verify

      # Catches a sync that stopped working without ever reporting it — the
      # workflow removed, never scheduled, or disabled. Deliberately does not
      # block the deploy: refusing to publish because the prices are old would
      # strand the site on those same prices and block the fix (D11).
      - name: Check the catalogue is still being refreshed
        id: freshness
        continue-on-error: true
        run: npm run check:catalogue -- --strict

      - name: Report a stale catalogue
        if: steps.freshness.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Bokadirekt catalogue has stopped refreshing';
            const body = [
              'The catalogue snapshot is old enough that the sync has almost certainly stopped running.',
              'The site is still deploying, but it is publishing prices that are no longer being checked against Bokadirekt.',
              '',
              'Most likely: GitHub disabled the scheduled workflows after a quiet period. Re-enable them in the Actions tab.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'catalogue-sync',
            });

            if (!open.some((issue) => issue.title === title)) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['catalogue-sync'] });
            }
      # enablement turns Pages on for the repository if it is off. It can fail
      # when the default token lacks admin rights; if it does, set
      # Settings > Pages > Source to "GitHub Actions" once and drop this input.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
