name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Runs after Sync Bokadirekt catalogue (03:00) so it deploys that night's
    # snapshot. This is also what applies a campaign's validTo without anyone
    # deploying by hand, and it is the only thing that starts a deploy after a
    # snapshot commit, since a push made with GITHUB_TOKEN triggers nothing.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify before deploying
        run: npm run verify
      # enablement turns Pages on for the repository if it is off. It can fail
      # when the default token lacks admin rights; if it does, set
      # Settings > Pages > Source to "GitHub Actions" once and drop this input.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
