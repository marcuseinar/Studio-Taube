# Updates are grouped by risk rather than by package, because the CI workflow
# auto-merges the safe group once every gate passes.
#
# Majors are deliberately kept out of the groups. Grouped with everything else,
# a single breaking change would hold the whole week's updates back until a
# person dealt with it — which, on a site with no developer watching, means
# indefinitely. Split out, they arrive as their own pull requests that wait for
# a human while the routine updates keep flowing.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
