name: Sync Bokadirekt catalogue

on:
  schedule:
    # Runs before the nightly Deploy, so a withdrawn offer is off the site the
    # same night. See the ordering note below.
    - cron: '0 3 * * *'
  # Lets a Bokadirekt webhook refresh the site within minutes instead of at the
  # next nightly run. See docs/ARCHITECTURE.md for the relay that turns a
  # webhook into this event.
  repository_dispatch:
    types: [bokadirekt-changed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-catalogue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Exit 2 means a source failed but a fallback produced a usable
      # catalogue: the site should still be updated, and someone should still
      # be told. Anything else non-zero leaves the previous snapshot in place.
      - name: Refresh the catalogue snapshot
        id: sync
        env:
          BOKADIREKT_SOURCE: ${{ vars.BOKADIREKT_SOURCE || 'page' }}
          BOKADIREKT_API_URL: ${{ secrets.BOKADIREKT_API_URL }}
          BOKADIREKT_API_KEY: ${{ secrets.BOKADIREKT_API_KEY }}
          BOKADIREKT_API_AUTH: ${{ vars.BOKADIREKT_API_AUTH }}
          BOKADIREKT_API_AUTH_NAME: ${{ vars.BOKADIREKT_API_AUTH_NAME }}
          BOKADIREKT_API_DURATION: ${{ vars.BOKADIREKT_API_DURATION }}
        run: |
          set +e
          node scripts/sync-bokadirekt-catalogue.mjs
          code=$?
          set -e
          echo "degraded=$([ "$code" = "2" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ] || [ "$code" = "2" ]; then exit 0; fi
          exit "$code"

      - name: Check the site still builds against it
        run: npm run verify

      # A treatment the salon added this morning is not a reason to stop
      # deploying, so this reports rather than gates. What it cannot do is
      # write the Swedish and English copy the new treatment needs, which is
      # why it ends in an issue addressed to a person.
      - name: Look for treatments the site has not caught up with
        id: drift
        continue-on-error: true
        run: |
          set +e
          report=$(node scripts/check-catalogue-drift.mjs --strict)
          code=$?
          set -e
          echo "$report"
          {
            echo 'report<<DRIFT_EOF'
            echo "$report"
            echo 'DRIFT_EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Commit the snapshot if it changed
        run: |
          if git diff --quiet -- data/; then
            echo "Catalogue and metadata unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m 'chore: refresh Bokadirekt catalogue snapshot'
          git push
          # A push made with GITHUB_TOKEN deliberately does not trigger other
          # workflows, so this does not start a deploy. The nightly Deploy cron
          # runs shortly after and picks the new snapshot up.

      # Nobody watches the Actions tab of a site that has been handed over. An
      # issue e-mails whoever is watching the repository and stays visible
      # until it is dealt with, which a red workflow run does not.
      - name: Report a failed or degraded sync
        if: failure() || steps.sync.outputs.degraded == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const degraded = '${{ steps.sync.outputs.degraded }}' === 'true';
            const title = degraded
              ? 'Bokadirekt sync is falling back to the salon page'
              : 'Bokadirekt catalogue sync is failing';
            const body = [
              degraded
                ? 'The preferred catalogue source failed and the sync fell back. The site is current, but the preferred source needs attention.'
                : 'The catalogue sync failed, so the site is still serving the previous snapshot. Prices will drift until this is fixed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'catalogue-sync',
            });

            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['catalogue-sync'] });
            }

      # Kept as one issue that is edited in place rather than a nightly comment:
      # this list changes only when the salon changes it, and a thread that
      # grows every night is a thread nobody opens.
      - name: Report treatments missing from the site
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Bokadirekt has treatments the site does not';
            // toJSON emits a complete JS string literal, so it is assigned
            // rather than interpolated — inside a template literal its quotes
            // would end up in the issue body.
            const report = ${{ toJSON(steps.drift.outputs.report) }};
            const body = [
              report,
              '',
              'Prices and durations look after themselves; these need words. Add an entry in',
              '`src/content/services/{sv,en}/` for each, or close this if the salon does not want them published.',
              '',
              `Last checked: ${new Date().toISOString().slice(0, 10)}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'catalogue-drift',
            });

            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['catalogue-drift'] });
            }
